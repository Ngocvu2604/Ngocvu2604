name: Generate Galaga

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: galaga-contribution
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Generate Galaga SVG
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: Ngocvu2604
          github_token: ${{ secrets.GITHUB_TOKEN }}
          games: galaga

      - name: Publish Galaga SVG
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: galaga-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
